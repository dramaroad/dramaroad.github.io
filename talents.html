<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="استكشف مواهب Drama Road حسب العمر والنوع والمهارات"><title>المواهب | Drama Road</title><link rel="stylesheet" href="styles.css"></head><body data-page="talents"><div id="siteHeader"></div><main>
